{%extends "base.html"%}{%block title%}room{%endblock%}
{%block content%}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">

    <h2>Channel Code : {{code}}</h2>
            </div>
        <div class="card-body">
            <div class="border rounded p-3 mb-3" id="messages" style="height:300px; overflow-y:auto;">
                </div>
       <div class="input">
        <input type="text" class="form-control" placeholder="message" name="message" id="message" />
        <div class="mb-3">
            <input type="file" id="imageInput" accept="image/*">

        </div>
        <div class="mb-3">

        <button type="submit" class="btn btn-primary" name="send" id="send-btn" onClick="sendMessage()"> Post </button>
            <button type="button" id="sendImageButton" class="btn btn-secondary">Send Image</button>
            <a href="/channel" class="btn btn-primary">Back</a>

       </div>

      </div>


    </div>

</div>

<script type="text/javascript">
    var socketio=io();

    const messages= document.getElementById("messages")
    const createMessage=(name,msg)=>{
      const content=`
      <div class="alert alert-secondary" role="alert">
         <strong>${name}:</strong>${msg}
      <span class="small text-muted d-block">${new Date().toLocaleString()}

      </span>


            </div>
      `;
      messages.insertAdjacentHTML("beforeend",content);
      messages.scrollTop=messages.scrollHeight;


    };
    socketio.on("message",(data)=>{
      createMessage(data.name,data.message);
      console.log(`${data.name}:${data.message}`);



    });

    const sendMessage=() =>{
    const message=document.getElementById("message");
    if(message.value==="")return;
    socketio.emit("message",{name:"You",data:message.value});
    message.value="";

    };




  const imageInput=document.getElementById('imageInput');
  const sendImageButton=document.getElementById('sendImageButton');

  sendImageButton.addEventListener('click',()=>{
        const file=imageInput.files[0];
        if(file){
            const reader= new FileReader();
            reader.onload= function(e){
              const imageData=e.target.result;
              console.log("Image data loaded:",imageData.slice(0,50));

              socketio.emit('send_image',{

                 username:"You",


                 image:imageData

              });
            }
            reader.readAsDataURL(file);
        }else{
           console.log("No file selected");

        }

  });

  socketio.on('receive_image',function(data){
  let imageMessageElement=document.createElement('div');

  imageMessageElement.innerHTML=`

    <div class="alert alert-secondary" role="alert">

    <strong>${data.username}:</strong>
    <br>
    <img src="${data.image}" alt="shared image" style="max-width:100%;height:auto;">
    <span class="small text-muted d-block">${new Date().toLocaleString()}</span>
    </div>
  `;

  messages.appendChild(imageMessageElement);
  messages.scrollTop=messages.scrollHeight;
  });


</script>
{% for msg in messages %}
   <script type="text/javascript">
       createMessage("{{msg.name}}","{{msg.message}}")
   </script>
{% endfor %}

{%endblock%}
