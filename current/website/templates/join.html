{% extends 'base.html' %}{%block title%} join{%endblock%}
{% block content %}
 <div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">

            <h1>Join</h1>

        </div>
   <form method="post" class="alert alert-info">
       <br>
     <div>
        <label>Name:</label>
        <input type="text" placeholder="Username" name="name" value="{{name}}"/>
     </div>
     <div class="join">
        <label>Room Code:</label>
        <input type="text" placeholder="Room Code" name="code" value="{{code}}"/>
        <button type="submit" name="join" class="btn btn-primary">Join</button>
         <a href="/channel" class="btn btn-primary">Back</a>
    </div>

    {% if error %}
     <ul>
        <li>{{error}}</li>
    </ul>
    {% endif %}


   </form>
 </div>

{% endblock %}
