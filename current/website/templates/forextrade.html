<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Place Order</h5>
            </div>
            <div class="card-body">
                <form method="POST" id="tradeForm">
                    <div class="mb-3">

                         <label for="base_currency" class="form-label">Base Currency</label>
                        <input type="text" class="form-control" id="base_currency" name="base_currency" required>
                    </div>

                    <div class="mb-3">

                         <label for="target_currency" class="form-label">target Currency</label>
                        <input type="text" class="form-control" id=target_currency" name="target_currency" required>
                    </div>


                    <div class="mb-3">

                         <label for="amount" class="form-label">Amount</label>
                        <input type="number" class="form-control" step="0.01" id="amount" name="amount" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Execute Forex</button>
                </form>
            </div>
        </div>
    </div>
</div>
