{% extends 'base.html' %}

{% block content %}


<br>
<br>
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <i class="fas fa-chart-line"></i> Stock Trading</a>
        <div class="navbar-nav ms-auto">

              <br>
              <a class="nav-link" href="{{ url_for('cryptomain.dashboard') }}">Dashboard</a>
              <a class="nav-link" href="{{ url_for('cryptomain.trade') }}">Trade</a>
              <a class="nav-link" href="{{ url_for('cryptomain.logout') }}">Logout</a>

            </div>

    </div>
 </nav>
<br>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Trade Cryptocurrency</h5>
            </div>
            <div class="card-body">
                <form method="POST" id="tradeForm">
                    <div class="mb-3">
                        <label for="symbol" class="form-label">Crypto Symbol (e.g., BTC, ETH)</label>
                        <input type="text" class="form-control" id="symbol" name="symbol" required>
                    </div>
                    <div class="mb-3">
                        <label for="action" class="form-label">Action</label>
                        <select class="form-control" id="action" name="action" required>
                            <option value="buy">Buy</option>
                            <option value="sell">Sell</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="shares" class="form-label">Number of Coins</label>
                        <input type="number" step="any" class="form-control" id="shares" name="shares" required>
                    </div>
                        <button type="submit" class="btn btn-primary w-100">Place Order</button>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
