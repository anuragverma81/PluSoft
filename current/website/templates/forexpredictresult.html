{%extends 'base.html'%}
{%block title%}Forex-Prediction{%endblock%}
{%block content%}
  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="text-center text-success mb-4">Prediction Result</h2>

      <p class="lead text-center">
        Predicted Rate for <strong>{{ pair }}</strong>:<br>
        <span class="display-4 text-primary">{{ prediction }}</span>
      </p>

      <div class="text-center mt-4">
        <a href="/forexpredictintro" class="btn btn-outline-primary">Make Another Prediction</a>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>
{%endblock%}
