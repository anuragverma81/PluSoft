{%extends "base.html"%}{%block title%}Feedback{%endblock%}
{%block content%}

<div class="container mt-5">
    <div class="card">
        <div class="card title">
            <div class="alert alert-info">
<form method="POST">
    <h1 class="mb-4" align="center">Feedback</h1>

     <div class="form-group">
        <label for="name">Name</label>
        <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Name"

            />
    </div>

    <div class="form-group">
       <label for="email">Email Address</label>
        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter email"
            />
    </div>

    <label for="feedback">Feedback</label>
     <textarea name="feedback" id="feedback" class="form-control" placeholder="Feedback......"></textarea>


<br/>
    <button type="submit" class="btn btn-primary">Feedback</button>

    <a class="btn btn-secondary" href="/feedback">Another Feedback</a>



</form>
</div>
</div>
</div>
</div>
{%endblock%}
