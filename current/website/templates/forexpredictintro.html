{%extends 'base.html'%}
{%block title%}Forex-Prediction{%endblock%}

{%block content%}
  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center text-primary">Forex Price Prediction</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="form-group">
          <label for="base_currency">Base Currency (e.g. USD)</label>
          <input type="text" class="form-control" id="base_currency" name="base_currency" required>
        </div>

        <div class="form-group">
          <label for="target_currency">Target Currency (e.g. EUR)</label>
          <input type="text" class="form-control" id="target_currency" name="target_currency" required>
        </div>

        <div class="form-group">
          <label for="start_date">Start Date</label>
          <input type="text" class="form-control" id="start_date" name="start_date" placeholder="YYYY-MM-DD" required>
        </div>

        <div class="form-group">
          <label for="end_date">End Date</label>
          <input type="text" class="form-control" id="end_date" name="end_date" placeholder="YYYY-MM-DD" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Predict</button>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>

{%endblock%}
